name: Deploy a Producción

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build Angular (producción)
        run: npm run build -- --configuration production

      - name: Subir artefacto de build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/alcance-reducido-front/browser
          retention-days: 7

  deploy:
    name: Deploy a S3 + CloudFront
    needs: build
    runs-on: ubuntu-latest
    # Este environment tiene un "required reviewer" configurado en GitHub,
    # por lo que el job queda pausado esperando aprobación manual antes de correr.
    environment:
      name: production
      url: https://alcance-reducido.com
    steps:
      - name: Descargar artefacto de build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Subir archivos estáticos (cache largo)
        run: |
          aws s3 sync dist/ s3://${{ vars.S3_BUCKET }}/ \
            --delete \
            --cache-control "public, max-age=31536000" \
            --exclude "*.html" \
            --exclude "*.json" \
            --exclude "service-worker.js"

      - name: Subir HTML/JSON (sin cache)
        run: |
          aws s3 sync dist/ s3://${{ vars.S3_BUCKET }}/ \
            --delete \
            --cache-control "no-cache, no-store, must-revalidate" \
            --exclude "*" \
            --include "*.html" \
            --include "*.json" \
            --include "service-worker.js"

      - name: Invalidar cache de CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
